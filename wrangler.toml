name = "smriti-sathi-ai-proxy"
main = "cloudflare/ai-proxy-worker.mjs"
compatibility_date = "2026-09-10"
workers_dev = true

# Keep this list limited to real app origins. Provider credentials are added
# separately with `wrangler secret put` and never belong in this file.
[vars]
AI_PROXY_ORIGINS = "capacitor://localhost,http://localhost,https://localhost,http://127.0.0.1:5173,http://localhost:5173"
